[target.riscv32imc-unknown-none-elf]
linker = "ld.lld"
rustflags = ["-C", "force-frame-pointers"]

[env]
ESP_WIFI_CONFIG_RX_QUEUE_SIZE = "16"
ESP_WIFI_CONFIG_TX_QUEUE_SIZE = "16"
ESP_WIFI_CONFIG_STATIC_RX_BUF_NUM = "8"
ESP_WIFI_CONFIG_DYNAMIC_RX_BUF_NUM = "24"
ESP_WIFI_CONFIG_STATIC_TX_BUF_NUM = "0"
ESP_WIFI_CONFIG_DYNAMIC_TX_BUF_NUM = "24"
ESP_WIFI_CONFIG_RX_BA_WIN = "6"
ESP_WIFI_CONFIG_MAX_BURST_SIZE = "8"
ESP_WIFI_CONFIG_COUNTRY_CODE = "US"
